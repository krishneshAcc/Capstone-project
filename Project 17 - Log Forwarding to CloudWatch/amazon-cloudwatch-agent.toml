[agent]
  collection_jitter = "0s"
  debug = false
  flush_interval = "1s"
  flush_jitter = "0s"
  hostname = ""
  interval = "60s"
  logfile = "/opt/aws/amazon-cloudwatch-agent/logs/amazon-cloudwatch-agent.log"
  logtarget = "lumberjack"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  omit_hostname = false
  precision = ""
  quiet = false
  round_interval = false

[inputs]

  [[inputs.logfile]]
    destination = "cloudwatchlogs"
    file_state_folder = "/opt/aws/amazon-cloudwatch-agent/logs/state"

    [[inputs.logfile.file_config]]
      deployment_environment = ""
      file_path = "/var/log/syslog"
      from_beginning = true
      log_group_class = ""
      log_group_name = "/capstone/project17-syslog"
      log_stream_name = "ubuntu-syslog"
      pipe = false
      retention_in_days = -1
      service_name = ""
      timezone = "UTC"

    [[inputs.logfile.file_config]]
      deployment_environment = ""
      file_path = "/var/log/auth.log"
      from_beginning = true
      log_group_class = ""
      log_group_name = "/capstone/project17-syslog"
      log_stream_name = "ubuntu-auth"
      pipe = false
      retention_in_days = -1
      service_name = ""
      timezone = "UTC"

[outputs]

  [[outputs.cloudwatchlogs]]
    force_flush_interval = "5s"
    log_stream_name = "i-UNKNOWN"
    mode = "AZVM"
    profile = "default"
    region = "ap-south-1"
    region_type = "CM"
    shared_credential_file = "/home/clouduser/.aws/credentials"
